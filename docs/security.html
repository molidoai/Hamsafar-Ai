<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>امنیت آفلاین</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">خزانه v2</span></div>
  <h1>قفل همه داده محلی</h1>
  <p class="lead">سفر، SOS، گروه، دفتر، هزینه، جاده، تماس، چک‌لیست و نسخه با PIN رمز می‌شوند. هنوز PBKDF2 است، نه Argon2.</p>
  <div class="card">PIN (حداقل ۶ نشانه)<input id="pin" type="password" inputmode="numeric" style="width:100%;margin:8px 0;background:#07070c;color:#eef2ff;border:1px solid #1b2030;border-radius:10px;padding:8px"/></div>
  <div class="actions">
    <button class="btn" id="lock" type="button">قفل</button>
    <button class="btn ghost" id="unlock" type="button">باز</button>
    <button class="btn ghost" id="wipe" type="button">پاک</button>
  </div>
  <div id="out" class="card">وضعیت اینجاست</div>
</main>
<nav class="dock">
  <a href="./index.html">خانه</a>
  <a class="active" href="./security.html">امنیت</a>
  <a href="./backup.html">پشتیبان</a>
</nav>
<script type="module">
import { lockVault, unlockVault, snapshot, restore, DATA_KEYS } from "./offline-vault.js";
const out = document.getElementById("out");
document.getElementById("lock").onclick = async () => {
  const pin = document.getElementById("pin").value;
  if (pin.length < 6) return out.textContent = "PIN حداقل ۶ نشانه";
  await lockVault(pin, snapshot());
  out.textContent = "قفل شد. متن خام پاک شد.";
};
document.getElementById("unlock").onclick = async () => {
  try {
    const data = await unlockVault(document.getElementById("pin").value);
    if (!data) return out.textContent = "خزانه نیست";
    restore(data);
    out.textContent = "باز شد.";
  } catch {
    out.textContent = "PIN غلط";
  }
};
document.getElementById("wipe").onclick = () => {
  DATA_KEYS.concat(["hamsafar_vault","hamsafar_vault_salt"]).forEach((k) => localStorage.removeItem(k));
  out.textContent = "پاک شد";
};
</script>
</body></html>

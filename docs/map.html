<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>نقشه همسفر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Tahoma,sans-serif;background:#07070c;color:#eef2ff}
#map{height:78vh;width:100%}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
a,button{color:#22d3ee;background:transparent;border:1px solid #22d3ee;border-radius:10px;padding:6px 10px;text-decoration:none}
#status{padding:0 16px 12px;color:#8b93a7;font-size:13px}
</style>
</head>
<body>
<header>
  <strong>نقشه زنده همسفر</strong>
  <span>
    <button type="button" id="me">موقعیت من</button>
    <a href="./index.html">برگشت</a>
  </span>
</header>
<div id="status">نقشه OpenStreetMap — موقعیت دستگاه لحظه‌ای است، ترافیک راه نیست</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places = [
  ["تهران",35.6892,51.389],["کرج",35.84,50.9391],["قم",34.6416,50.8746],["اراک",34.0954,49.7013],
  ["قزوین",36.2797,50.0049],["زنجان",36.6736,48.4787],["همدان",34.7983,48.5146],["کرمانشاه",34.3142,47.065],
  ["سنندج",35.3219,46.9862],["ایلام",33.6374,46.4227],["خرم‌آباد",33.4878,48.3558],["اهواز",31.3183,48.6706],
  ["شهرکرد",32.3256,50.8644],["یاسوج",30.6682,51.588],["اصفهان",32.6546,51.668],["کاشان",33.985,51.41],
  ["یزد",31.8974,54.3569],["شیراز",29.5918,52.5836],["بوشهر",28.9234,50.8203],["بندرعباس",27.1832,56.2666],
  ["کیش",26.5578,53.9802],["قشم",26.9581,56.2719],["کرمان",30.2839,57.0834],["زاهدان",29.4963,60.8629],
  ["بیرجند",32.8663,59.2211],["مشهد",36.2605,59.6168],["بجنورد",37.4747,57.329],["سمنان",35.5769,53.3975],
  ["گرگان",36.8456,54.4393],["ساری",36.5633,53.0601],["رشت",37.2808,49.5832],["اردبیل",38.2498,48.2933],
  ["تبریز",38.0962,46.2738],["ارومیه",37.5527,45.0761]
];
const map = L.map("map").setView([32.4, 53.4], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "© OpenStreetMap"
}).addTo(map);
places.forEach(([name, lat, lng]) => L.marker([lat, lng]).addTo(map).bindPopup(name));
let meMarker;
document.getElementById("me").onclick = () => {
  if (!navigator.geolocation) {
    document.getElementById("status").textContent = "موقعیت در این مرورگر نیست";
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (!meMarker) meMarker = L.circleMarker([lat, lng], { radius: 9, color: "#22d3ee" }).addTo(map);
      else meMarker.setLatLng([lat, lng]);
      document.getElementById("status").textContent = "موقعیت شما: " + lat.toFixed(4) + ", " + lng.toFixed(4);
    },
    () => { document.getElementById("status").textContent = "دسترسی موقعیت رد شد"; },
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
};
</script>
</body></html>

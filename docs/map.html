<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نقشه همسفر</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    #map { height: calc(100vh - 118px); border-top: 1px solid var(--line); }
    .mapbar { display:flex; justify-content:space-between; align-items:center; padding: 12px 16px; }
    #status { color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
  </style>
</head>
<body>
  <div class="mapbar">
    <span class="brand">MOLIDO MAP</span>
    <button class="btn" id="me" type="button">موقعیت من</button>
  </div>
  <div id="status">OpenStreetMap — موقعیت دستگاه لحظه‌ای است</div>
  <div id="map"></div>
  <nav class="dock">
    <a href="./index.html">خانه</a>
    <a class="active" href="./map.html">نقشه</a>
    <a href="https://github.com/molidoai/Hamsafar-Ai">کد</a>
  </nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places = [["تهران",35.6892,51.389],["کرج",35.84,50.9391],["قم",34.6416,50.8746],["اصفهان",32.6546,51.668],["شیراز",29.5918,52.5836],["مشهد",36.2605,59.6168],["تبریز",38.0962,46.2738],["رشت",37.2808,49.5832],["یزد",31.8974,54.3569],["کیش",26.5578,53.9802],["قشم",26.9581,56.2719],["اهواز",31.3183,48.6706],["کرمان",30.2839,57.0834],["بندرعباس",27.1832,56.2666],["ساری",36.5633,53.0601],["همدان",34.7983,48.5146],["ارومیه",37.5527,45.0761],["اردبیل",38.2498,48.2933]];
    const map = L.map("map").setView([32.4, 53.4], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
    places.forEach(([n,a,b]) => L.marker([a,b]).addTo(map).bindPopup(n));
    let meMarker;
    document.getElementById("me").onclick = () => {
      if (!navigator.geolocation) return document.getElementById("status").textContent = "موقعیت در این مرورگر نیست";
      navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (!meMarker) meMarker = L.circleMarker([lat,lng], { radius: 8, color: "#22d3ee" }).addTo(map);
        else meMarker.setLatLng([lat,lng]);
        document.getElementById("status").textContent = "موقعیت شما: " + lat.toFixed(4) + ", " + lng.toFixed(4);
      }, () => document.getElementById("status").textContent = "دسترسی موقعیت رد شد", { enableHighAccuracy: true });
    };
  </script>
</body>
</html>

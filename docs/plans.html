<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>نسخه‌ها همسفر</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">نسخه</span></div>
  <h1>نسخه فعال را انتخاب کنید</h1>
  <p class="lead" id="current">نسخه فعلی: پایه</p>
  <article class="card"><h3>پایه</h3><div class="price">رایگان</div><p>سفر و مقصد</p><button class="btn" type="button" onclick="pick('personal','پایه')">فعال</button></article>
  <article class="card" style="margin-top:10px"><h3>خانواده</h3><div class="price">۶ دلار · ۲٫۹ م ریال</div><p>گروه و SOS — پرداخت واقعی نیست</p><button class="btn" type="button" onclick="pick('family','خانواده')">فعال تستی</button></article>
  <article class="card" style="margin-top:10px"><h3>حرفه‌ای</h3><div class="price">۱۹ دلار · ۹٫۹ م ریال</div><p>دستیار مسیر — پرداخت واقعی نیست</p><button class="btn" type="button" onclick="pick('pro','حرفه‌ای')">فعال تستی</button></article>
</main>
<nav class="dock">
  <a href="./index.html">خانه</a>
  <a class="active" href="./plans.html">نسخه</a>
  <a href="./trip.html">سفر</a>
  <a href="./sos.html">SOS</a>
</nav>
<script>
function show(){
  const e = JSON.parse(localStorage.getItem("hamsafar_edition")||'{"id":"personal","name":"پایه"}');
  document.getElementById("current").textContent = "نسخه فعلی: " + e.name;
}
function pick(id,name){
  localStorage.setItem("hamsafar_edition", JSON.stringify({id,name,at:Date.now()}));
  show();
}
show();
</script>
</body></html>

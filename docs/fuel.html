<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>سوخت</title>
<link rel="stylesheet" href="./styles.css"/>
<script src="./access.js"></script>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">سوخت</span></div>
  <h1>یادداشت سوخت</h1>
  <input id="km" type="number" placeholder="کیلومتر" class="card" style="width:100%"/>
  <input id="lit" type="number" placeholder="لیتر" class="card" style="width:100%;margin-top:8px"/>
  <button class="btn" id="go" type="button">ذخیره</button>
  <div id="out" class="card" style="margin-top:12px"></div>
</main>
<nav class="dock"><a href="./trip.html">سفر</a><a class="active" href="./fuel.html">سوخت</a><a href="./more.html">بیشتر</a></nav>
<script>
function draw(){const rows=JSON.parse(localStorage.getItem("hamsafar_exp")||"[]");document.getElementById("out").innerHTML=rows.map(r=>r.km+" کم / "+r.lit+" ل").join("<br>")||"خالی";}
document.getElementById("go").onclick=()=>{const km=+km.value,lit=+lit.value;if(!km||!lit)return;const rows=JSON.parse(localStorage.getItem("hamsafar_exp")||"[]");rows.unshift({km,lit,at:Date.now()});localStorage.setItem("hamsafar_exp",JSON.stringify(rows.slice(0,30)));draw();};
draw();
</script>
</body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>به‌روزرسانی</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">به‌روز</span></div>
  <h1>نسخه منتشر</h1>
  <article class="card" id="out">در حال خواندن…</article>
</main>
<nav class="dock">
  <a href="./more.html">بیشتر</a>
  <a class="active" href="./update.html">به‌روز</a>
  <a href="./about.html">درباره</a>
</nav>
<script>
fetch("./update.json").then(r=>r.json()).then(j=>{
  const apk = j.apk && j.apk !== "null";
  document.getElementById("out").innerHTML =
    "<p>نسخه "+j.versionName+" — کد "+j.versionCode+"</p>"+
    "<p>امضا "+(j.signing||[]).join(" / ")+"</p>"+
    "<p>APK: "+(apk?("<a href='"+j.apk+"'>دانلود</a>"):"منتشر نیست")+"</p>"+
    "<p>SHA-256 فایل: "+(j.apkSha256||"—")+"</p>"+
    "<p>گواهی: "+(j.certSha256||"—")+"</p>";
}).catch(()=>document.getElementById("out").textContent="مانیفست خوانده نشد");
</script>
</body></html>

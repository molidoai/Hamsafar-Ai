<html lang="fa" dir="rtl">
<head>

<title>به‌روز</title>

</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">به‌روز</span></div>
  <h1>نسخه منتشر</h1>
  <article class="card" id="out">در حال خواندن…</article>
</main>
<nav class="dock"><a href="./more.html">بیشتر</a><a class="active" href="./update.html">به‌روز</a><a href="./android.html">اپ</a></nav>
<script>
function show(j){
  const apk=j.apk&&j.apk!=="null";
  document.getElementById("out").innerHTML=
    "<p>"+j.versionName+" — کد "+j.versionCode+"</p>"+
    (apk?"<p><a href='"+j.apk+"'>دانلود APK</a></p>":"<p>فایل نیست</p>");
}
fetch("./update-32.json").then(r=>r.json()).then(show)
  .catch(()=>fetch("./update.json").then(r=>r.json()).then(show)
  .catch(()=>document.getElementById("out").textContent="مانیفست نیامد"));
</script>
</body></html>

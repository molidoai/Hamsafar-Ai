<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>سرعت</title>
<link rel="stylesheet" href="./styles.css"/>
<script src="./access.js"></script>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">سرعت</span></div>
  <h1>هشدار سرعت محلی</h1>
  <p class="lead">سقف کیلومتر بر ساعت. بدون سرور.</p>
  <input id="cap" type="number" value="110" class="card" style="width:100%"/>
  <p id="out" class="card" style="margin-top:10px">منتظر GPS…</p>
</main>
<nav class="dock"><a href="./map.html">نقشه</a><a class="active" href="./speed.html">سرعت</a><a href="./more.html">بیشتر</a></nav>
<script>
function tick(p){
  const kmh = (p.coords.speed||0)*3.6;
  const cap = +document.getElementById("cap").value||110;
  document.getElementById("out").textContent = Math.round(kmh)+" کم/س — سقف "+cap+(kmh>cap?" — بیش از سقف":"");
}
if(navigator.geolocation) navigator.geolocation.watchPosition(tick,()=>document.getElementById("out").textContent="GPS نیست",{enableHighAccuracy:true});
</script>
</body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>دفتر</title>
<link rel="stylesheet" href="./styles.css"/>
<script src="./access.js"></script>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">دفتر</span></div>
  <h1>یادداشت سفر</h1>
  <textarea id="note" class="card" rows="4" style="width:100%" placeholder="چه دیدید"></textarea>
  <button class="btn" id="add" type="button">ثبت</button>
  <div id="out" class="card" style="margin-top:12px"></div>
</main>
<nav class="dock"><a href="./trip.html">سفر</a><a class="active" href="./journal.html">دفتر</a><a href="./more.html">بیشتر</a></nav>
<script>
function rows(){return JSON.parse(localStorage.getItem("hamsafar_journal")||"[]")}
function draw(){document.getElementById("out").innerHTML=rows().map(r=>r.t).join("<hr>")||"خالی"}
document.getElementById("add").onclick=()=>{const t=document.getElementById("note").value.trim();if(!t)return;const a=rows();a.unshift({t,at:Date.now()});localStorage.setItem("hamsafar_journal",JSON.stringify(a.slice(0,50)));document.getElementById("note").value="";draw()}
draw()
</script>
</body></html>

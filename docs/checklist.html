<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>چک‌لیست همسفر</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">چک‌لیست</span></div>
  <h1>قبل حرکت</h1>
  <p class="lead">وضعیت روی همین گوشی می‌ماند.</p>
  <div id="list"></div>
</main>
<nav class="dock">
  <a href="./index.html">خانه</a>
  <a href="./trip.html">سفر</a>
  <a class="active" href="./checklist.html">چک‌لیست</a>
  <a href="./more.html">بیشتر</a>
</nav>
<script>
const items = ["بنزین پر باشد","آب برداشته شد","چراغ گوشی کامل است","کیسه آفلاین روشن است","شماره اضطراری ذخیره شد","مسیر روی همسفر ساخته شد","PIN امنیت وضع شد"];
const key = "hamsafar_check";
let state = JSON.parse(localStorage.getItem(key) || "{}");
const box = document.getElementById("list");
function draw(){
  box.innerHTML = items.map((t,i)=>`<label class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><input type="checkbox" data-i="${i}" ${state[i]?"checked":""}/> <span>${t}</span></label>`).join("");
}
box.onchange = (e) => {
  const i = e.target.getAttribute("data-i");
  if (i == null) return;
  state[i] = e.target.checked;
  localStorage.setItem(key, JSON.stringify(state));
};
draw();
</script>
</body></html>

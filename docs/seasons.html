<script>
const seasons=[["فروردین","نوروز"],["اردیبهشت","اوج بهار"],["خرداد","پایان بهار"],["تیر","گرما"],["مرداد","کم‌سفر"],["شهریور","تابستان"],["مهر","مدارس"],["آبان","پاییز"],["آذر","میانه"],["دی","آرام"],["بهمن","زمستان"],["اسفند","عید"]];
document.getElementById("list").innerHTML=seasons.map(([n,note])=>`<article class="card" style="margin-bottom:8px"><h3>${n}</h3><p>${note} — رایگان</p></article>`).join("");

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>۱۲ فصل</title>
<link rel="stylesheet" href="./styles.css"/>
<script src="./access.js"></script>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">MOLIDO</span><span class="ver">۱۲ فصل</span></div>
  <h1>فصل‌های جدید</h1>
  <div id="out"></div>
</main>
<nav class="dock"><a href="./peak.html">اوج</a><a class="active" href="./seasons.html">فصل</a><a href="./more.html">بیشتر</a></nav>
<script>
fetch("./seasons.json").then(r=>r.json()).then(rows=>{
  document.getElementById("out").innerHTML=rows.map(s=>
    `<article class="card" style="margin-top:8px"><h3>${s.id}. ${s.name}</h3><p>${s.when} — بار ${s.load}</p><p>${s.note}</p></article>`
  ).join("");
}).catch(()=>{document.getElementById("out").textContent="داده نیامد";});
</script>
</body></html>

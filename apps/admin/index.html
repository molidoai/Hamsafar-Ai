<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>MOLIDO Control Center</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #020617; color: #e2e8f0; margin: 0; }
    main { max-width: 900px; margin: auto; padding: 28px 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: #111827; padding: 16px; border-radius: 14px; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <main>
    <h1>مرکز کنترل مولیدو</h1>
    <p>نسخه محلی — بدون سرور ابری</p>
    <div class="grid">
      <div class="card">فاز 000 <div class="ok">PASS</div></div>
      <div class="card">فاز 001 <div class="ok">PASS</div></div>
      <div class="card">فاز 002 <div class="ok">PASS</div></div>
      <div class="card">فاز 003 <div class="ok">PASS</div></div>
      <div class="card">فاز 004 <div class="ok">PASS</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <p>دامنه بعدی: hamsafa.molido.shop</p>
      <p>API محلی: http://127.0.0.1:8080/health</p>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مولیدو همسفر</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>مولیدو همسفر</h1>
    <p>نسخه تست محلی • بدون هاست</p>
    <p id="updateBanner">در حال بررسی به‌روزرسانی...</p>
  </header>
  <nav>
    <button onclick="show('home')">خانه</button>
    <button onclick="show('dest')">مقصد</button>
    <button onclick="show('sos')">اضطراری</button>
    <button onclick="show('status')">وضعیت</button>
  </nav>
  <main>
    <section id="home" class="page">
      <input id="email" value="demo@molido.shop" />
      <input id="password" type="password" value="secret123" />
      <button class="primary" onclick="loginAndTrip()">ورود و ساخت سفر</button>
      <p id="homeOut">برای تست، اول API محلی را روشن کنید.</p>
    </section>
    <section id="dest" class="page hidden">
      <input id="q" value="اصفهان" />
      <button class="primary" onclick="searchDest()">جستجو</button>
      <div id="places"></div>
    </section>
    <section id="sos" class="page hidden">
      <p>ارسال آزمایشی SOS برای مخاطب مطمئن.</p>
      <button class="danger" onclick="sendSos()">ارسال SOS</button>
      <p id="sosOut"></p>
    </section>
    <section id="status" class="page hidden">
      <button class="primary" onclick="loadHealth()">بررسی سلامت</button>
      <pre id="healthOut"></pre>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
